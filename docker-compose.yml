# Makutano Connect — production deployment.
#
#   cp .env.production.example .env      # fill in real values
#   docker compose up -d --build
#   docker compose exec connect node --experimental-strip-types scripts/migrate.ts
#
# Caddy terminates TLS for connect.makutano.co.tz and proxies to this container over
# the shared `makutano-net` network, matching the existing production setup. The app
# port is NOT published to the host: the only way in is through Caddy.

services:
  connect:
    build: .
    image: makutano-connect
    container_name: makutano-connect
    restart: unless-stopped

    # All secrets injected at runtime — the image contains none.
    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Public origin. REQUIRED behind a domain/proxy or every form POST fails
      # SvelteKit's CSRF origin check, and Embedded Signup launch URLs come out wrong.
      ORIGIN: ${PUBLIC_APP_URL:-https://connect.makutano.co.tz}
      # Let adapter-node build correct https URLs from Caddy's forwarded headers.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Without this, adapter-node reads the socket peer address — which behind the
      # shared Caddy is Caddy's own container IP for EVERY visitor. Per-IP rate
      # limiting then collapses into one bucket shared by the whole internet: one
      # busy crawler exhausts it and the marketplace, whose API client swallows
      # errors and renders empty, quietly shows nothing to everyone else.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      # The in-process queue drains WhatsApp sends and webhook processing.
      JOB_WORKER: "on"

    networks:
      - makutano-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ---------------------------------------------------------------------------
  # Tracking worker — the ONLY process holding a privileged Traccar credential.
  #
  # Same image as the web service, deliberately: one repository, one build, no
  # second deployment story. What differs is the ENVIRONMENT. The web container
  # above has no provisioning credential and cannot create a device even if its
  # code asked to; this one can, and serves no HTTP at all.
  #
  # No ports, no Caddy route, not on any public network path. It reads the
  # ledger, provisions devices, grants them to tenants' read-only identities,
  # detects first fixes as the TENANT, and deletes retired devices.
  #
  # restart: unless-stopped covers process failure, container restart and VPS
  # reboot — which is the whole scheduler. The claim is a lease, so a restart
  # mid-provision resumes safely rather than duplicating anything.
  # ---------------------------------------------------------------------------
  tracking-worker:
    image: makutano-connect
    container_name: makutano-tracking-worker
    depends_on:
      - connect
    restart: unless-stopped

    env_file:
      - .env
      # Provisioning credential lives ONLY here. Deliberately a separate file so
      # it cannot be picked up by the web service's env_file.
      - .env.tracking-worker

    environment:
      NODE_ENV: production
      # No HTTP server in this process.
      JOB_WORKER: "off"
      TRACKING_WORKER_INTERVAL_MS: "10000"

    command: ["node", "--experimental-strip-types", "--import", "./scripts/register-loader.mjs", "scripts/tracking-worker.ts", "--loop"]

    # The image healthcheck probes HTTP on :3000. This process serves no HTTP and
    # never will, so it would sit permanently unhealthy while working perfectly —
    # which is worse than no signal, because it trains people to ignore the field.
    # Check the thing that actually matters: the process is alive.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f tracking-worker.ts > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    networks:
      - makutano-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  makutano-net:
    external: true
